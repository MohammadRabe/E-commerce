services:
  seq:
    image: datalust/seq:latest
    container_name: ecommerce-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?Set SEQ_ADMIN_PASSWORD before starting Seq}
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

volumes:
  seq-data:
